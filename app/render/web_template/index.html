<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Virtual-Chalk render surface</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>

  <script src="themes.js"></script>
  <script src="surfaces/board_noise.js"></script>
  <script src="surfaces/blackboard.js"></script>
  <script src="surfaces/greenboard.js"></script>
  <script src="surfaces/whiteboard.js"></script>
  <script src="tools/chalk.js"></script>
  <script src="tools/marker_veleda.js"></script>
  <script src="text_to_path.js"></script>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    let currentScene = null;
    let currentTheme = null;

    // Appelé par Python (FrameCapture) avant de rendre les frames d'une scène.
    window.loadScene = function (scene, themeId) {
      currentScene = scene;
      currentTheme = window.getTheme(themeId);
    };

    // Appelé par Python pour chaque frame, avec le temps virtuel écoulé (s).
    // start_sec/end_sec de chaque stroke sont calculés côté Python
    // (app/render/timing.py) : le JS ne fait que les lire, pour que les
    // tracés s'écrivent l'un après l'autre plutôt que tous en même temps.
    window.renderAtTime = function (t) {
      if (!currentScene || !currentTheme) return;
      const { width, height } = canvas;
      window.SURFACES[currentTheme.surface](ctx, width, height);

      const drawStroke = window.TOOLS[currentTheme.tool];
      for (const stroke of currentScene.strokes || []) {
        const span = Math.max(stroke.end_sec - stroke.start_sec, 0.0001);
        const progress = Math.min(1, Math.max(0, (t - stroke.start_sec) / span));
        if (progress > 0) drawStroke(ctx, stroke, progress);
      }
    };
  </script>
</body>
</html>
