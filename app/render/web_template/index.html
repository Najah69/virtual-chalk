<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Virtual-Chalk render surface</title>
  <style>
    html, body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>

  <script src="themes.js"></script>
  <script src="surfaces/board_noise.js"></script>
  <script src="surfaces/blackboard.js"></script>
  <script src="surfaces/greenboard.js"></script>
  <script src="surfaces/whiteboard.js"></script>
  <script src="tools/chalk.js"></script>
  <script src="tools/marker_veleda.js"></script>
  <script src="opentype.min.js"></script>
  <script src="text_to_path.js"></script>
  <script src="icon_paths.js"></script>
  <script src="icon_to_path.js"></script>
  <script src="icon_sprite.js"></script>
  <script src="anime.min.js"></script>
  <script src="motion_easing.js"></script>
  <script src="animations.js"></script>
  <script src="mascot.js"></script>
  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    let currentScene = null;
    let currentTheme = null;
    let currentThemeId = null;

    // Appelé par Python (FrameCapture) avant de rendre les frames d'une scène.
    // Les strokes de type "texte" n'arrivent qu'avec un point d'ancrage
    // (position) — on les développe ici en tracé dessinable, une seule fois
    // par scène, pas à chaque frame.
    // Le fond du tableau est dessiné ICI, une seule fois : il ne change
    // jamais pendant la scène (seule la craie s'accumule dessus), donc pas
    // besoin de le redessiner à chaque frame comme avant.
    window.loadScene = function (scene, themeId, canvasWidth, canvasHeight) {
      // Redimensionne le backing store AVANT de dessiner le fond : changer
      // canvas.width/height efface aussi le contenu existant (comportement
      // natif du canvas), donc l'ordre importe peu ici, mais le faire en
      // premier évite de dessiner un fond qui serait immédiatement perdu.
      if (canvasWidth && canvasHeight) {
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
      }
      currentScene = scene;
      currentTheme = window.getTheme(themeId);
      currentThemeId = themeId;
      for (const stroke of currentScene.strokes || []) {
        if (stroke.kind === "text" && stroke.text) {
          const anchor = stroke.points[0];
          stroke.points = window.textToPaths(stroke.text, anchor.x, anchor.y, stroke.width);
        } else if (stroke.kind === "icon" && stroke.text) {
          const anchor = stroke.points[0];
          stroke.points = window.iconToPoints(stroke.text, anchor.x, anchor.y, stroke.width);
        } else if (stroke.kind === "image" && stroke.image_data) {
          // Décodage asynchrone (même un data URI n'est pas garanti
          // synchrone) : Python attend window.allImagesReady() avant de
          // lancer le rendu des frames (voir capture.py) plutôt que
          // d'appeler loadScene en async — testé empiriquement,
          // evaluate_js ne résout pas correctement une Promise renvoyée.
          stroke._imageReady = false;
          const img = new Image();
          img.onload = () => { stroke._imageReady = true; };
          img.onerror = () => { stroke._imageReady = true; stroke._imageEl = null; };
          img.src = stroke.image_data;
          stroke._imageEl = img;
        }
        stroke._lastDrawnCount = 0;
      }
      const { width, height } = canvas;
      window.SURFACES[currentTheme.surface](ctx, width, height);
    };

    // Vrai dès que tous les strokes "image" de la scène courante ont fini
    // de décoder (ou ont échoué) — voir loadScene. Vrai trivialement s'il
    // n'y en a aucun, pour que Python n'attende jamais inutilement.
    window.allImagesReady = function () {
      return (currentScene && currentScene.strokes || []).every(
        (s) => s.kind !== "image" || s._imageReady
      );
    };

    // Appelé par Python pour chaque frame, avec le temps virtuel écoulé (s).
    // start_sec/end_sec de chaque stroke sont calculés côté Python
    // (app/render/timing.py) : le JS ne fait que les lire, pour que les
    // tracés s'écrivent l'un après l'autre plutôt que tous en même temps.
    //
    // Rendu INCRÉMENTAL : on ne redessine jamais depuis le début d'un
    // tracé, seulement la portion nouvellement révélée depuis le dernier
    // appel (stroke._lastDrawnCount, géré par chaque outil). Redessiner
    // tout à chaque frame coûtait O(frames × tampons visibles) — avec de
    // vrais contours de lettres (bien plus de points qu'un simple
    // placeholder), ce coût explosait et rendait le rendu très lent.
    // Les strokes de type "animation" sont un cas à part : redessinés à
    // CHAQUE frame tant qu'ils sont dans leur fenêtre active (ils
    // "effacent" leur propre zone depuis le cache de texture du tableau à
    // chaque appel, voir animations.js), puis figés une fois pour toutes
    // dès que le temps dépasse leur end_sec — après quoi on ne les touche
    // plus jamais, cohérent avec le reste du moteur qui n'efface rien.
    window.renderAtTime = function (t) {
      if (!currentScene || !currentTheme) return;
      const drawStroke = window.TOOLS[currentTheme.tool];
      for (const stroke of currentScene.strokes || []) {
        const span = Math.max(stroke.end_sec - stroke.start_sec, 0.0001);
        const progress = Math.min(1, Math.max(0, (t - stroke.start_sec) / span));
        if (progress <= 0) continue;

        if (stroke.kind === "animation") {
          if (stroke._frozen) continue;
          const fn = window.ANIMATIONS[stroke.text];
          if (fn) {
            const boardTexture = window._boardTextureCache[currentTheme.surface] || null;
            fn(ctx, stroke, t - stroke.start_sec, boardTexture, currentTheme.tool);
          }
          if (t >= stroke.end_sec) stroke._frozen = true;
        } else if (stroke.kind === "image") {
          // Pas de tracé progressif possible pour un bitmap (contrairement
          // au texte/icônes) : simple fondu d'apparition (globalAlpha),
          // puis figé — comme les animations, jamais retouché une fois
          // end_sec dépassé. Courbe easeOutCubic (window.easedProgress,
          // voir motion_easing.js) plutôt qu'un fondu linéaire — premier
          // usage d'Anime.js, utilisé ici uniquement comme bibliothèque
          // d'easing pur, jamais son moteur temps réel.
          if (stroke._frozen) continue;
          if (stroke._imageEl) {
            ctx.save();
            ctx.globalAlpha = window.easedProgress(progress, "easeOutCubic");
            ctx.drawImage(stroke._imageEl, stroke.points[0].x, stroke.points[0].y, stroke.width, stroke.height);
            ctx.restore();
          }
          if (t >= stroke.end_sec) stroke._frozen = true;
        } else {
          drawStroke(ctx, stroke, progress);
        }
      }
      if (currentScene.mascot_timeline && currentScene.mascot_timeline.length) {
        const boardTexture = window._boardTextureCache[currentTheme.surface] || null;
        window.drawMascot(ctx, currentScene, t, boardTexture, canvas.width, canvas.height, currentThemeId);
      }
    };

    // Rend et capture plusieurs frames en un seul aller-retour JS<->Python
    // (au lieu d'un aller-retour par frame) : évite l'essentiel du surcoût
    // d'IPC mesuré à ~300ms/frame avec l'approche "un evaluate_js par frame".
    window.renderFrames = function (startT, count, fps) {
      const results = [];
      for (let i = 0; i < count; i++) {
        window.renderAtTime(startT + i / fps);
        // JPEG plutôt que PNG : les frames sont de toute façon ré-encodées
        // en H.264 (avec perte) juste après par ffmpeg, et PNG est
        // dramatiquement plus lourd sur une image texturée/bruitée (grain
        // craie, fond tableau) car peu compressible sans perte.
        results.push(canvas.toDataURL("image/jpeg", 0.9));
      }
      return results;
    };
  </script>
</body>
</html>
