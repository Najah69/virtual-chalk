<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Virtual-Chalk — Éditeur</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .editor-layout { display: flex; flex: 1; min-height: 0; }
    .scene-list { width: 220px; border-right: 1px solid #e2e0da; overflow-y: auto; }
    .scene-list .scene-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #eee; }
    .scene-list .scene-item.selected { background: var(--board-green); color: white; }
    .canvas-preview { flex: 1; display: flex; align-items: center; justify-content: center; background: #222; }
    .properties-panel { width: 280px; border-left: 1px solid #e2e0da; padding: 16px; overflow-y: auto; }
    .nl-edit-bar { border-top: 1px solid #e2e0da; padding: 12px 16px; display: flex; gap: 8px; align-items: flex-start; }
    .nl-edit-bar input { flex: 1; padding: 8px; }
    .nl-edit-status { font-size: 13px; color: #666; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="editor-layout">
    <div class="scene-list" id="scene-list"></div>
    <div class="canvas-preview">
      <canvas id="preview-canvas" width="960" height="540" style="background:#1f4d3a"></canvas>
    </div>
    <div class="properties-panel">
      <h3>Propriétés</h3>
      <label>Texte<textarea id="prop-text" rows="4" style="width:100%"></textarea></label>
      <label>Couleur de craie/feutre
        <input type="color" id="prop-color" />
      </label>
      <label>Durée (s)<input type="number" id="prop-duration" /></label>
      <div style="margin-top:16px">
        <button class="primary" id="btn-rerender-scene">Re-render cette scène</button>
        <button class="secondary" id="btn-rerender-all">Re-render tout</button>
      </div>
    </div>
  </div>

  <div class="nl-edit-bar">
    <div style="flex:1">
      <input type="text" id="nl-command-input" placeholder='Ex : "Raccourcis la scène 3 à 15 secondes" ou "Remplace le thème par tableau blanc feutres"' />
      <div class="nl-edit-status" id="nl-command-status"></div>
    </div>
    <button class="primary" id="btn-nl-apply">Appliquer</button>
  </div>

  <script src="editor.js"></script>
</body>
</html>
